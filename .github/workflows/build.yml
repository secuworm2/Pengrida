name: Pengrida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "ci"]
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"

jobs: 
  check_version:
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v3
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const releaseResponse = await github.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            })
            const {
              data: { tag_name: ver }
            } = releaseResponse;
            core.setOutput('FRIDA_VERSION', ver);

      - name: Split Repository Name
        id: split_name
        run: |
          repo_name=${{ github.repository }}
          IFS='/' read -ra repo_parts <<< "$repo_name"
          echo "owner=${repo_parts[0]}" >> $GITHUB_OUTPUT
          echo "repo=${repo_parts[1]}" >> $GITHUB_OUTPUT

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v3
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'
              const releaseResponse = await github.repos.getReleaseByTag({
                owner: '${{ steps.split_name.outputs.owner }}',
                repo: '${{ steps.split_name.outputs.repo }}',
                tag: releaseVersion
              });
              const {
                data: { tag_name: ver }
              } = releaseResponse;
              if (ver == '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'){
                  if ( ${{ ( github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}){
                    core.setOutput('ALREADY_RELEASE', '2');
                  } else {
                    core.setOutput('ALREADY_RELEASE', '1');
                  }
              }
              else{
                  core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if(e.message == 'Not Found'){
                core.setOutput('ALREADY_RELEASE', '0');
              }
              else{
                core.setFailed(e.message);
              }
            }
      
      - name: Delete release
        if: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE == '2' }}
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE != '1'

    steps:
      - uses: softprops/action-gh-release@v2.1.0
        id: createRelease
        name: Create Runner Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: false
        link-to-sdk: true

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: build frida for Android
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
        
        git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        for path in ../patches/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "Apply patches in $real to frida/subprojects/$name"
          cd subprojects/$name
          for patchfile in ../../../patches/$name/*.patch
          do
            echo "Applying $patchfile"
            if ! git am --3way "$patchfile"; then
              echo "Patch failed, aborting this patch and continuing"
              git am --abort
            fi
          done
          cd ../..
          echo $i
        done

        echo "Manually re-applying symbol_frida_agent_main (patch 0003 fails to apply upstream but its content still applies cleanly by hand)"
        cd subprojects/frida-core
        cat > src/anti-anti-frida.py << 'PYEOF'
        import lief
        import sys
        import random
        import os

        if __name__ == "__main__":
            input_file = sys.argv[1]
            print(f"[*] Patch frida-agent: {input_file}")
            random_name = "".join(random.sample("ABCDEFGHIJKLMNO", 5))
            print(f"[*] Patch `frida` to `{random_name}``")

            binary = lief.parse(input_file)

            if not binary:
                exit()

            for symbol in binary.symbols:
                if symbol.name == "frida_agent_main":
                    symbol.name = "main"

                if "frida" in symbol.name:
                    symbol.name = symbol.name.replace("frida", random_name)

                if "FRIDA" in symbol.name:
                    symbol.name = symbol.name.replace("FRIDA", random_name)

            binary.write(input_file)
        PYEOF
        sed -i 's/"frida_agent_main"/"main"/' src/agent-container.vala
        sed -i 's/"frida_agent_main"/"main"/' src/darwin/darwin-host-session.vala
        sed -i 's/"frida_agent_main"/"main"/' src/freebsd/freebsd-host-session.vala
        sed -i 's/"frida_agent_main"/"main"/' src/linux/linux-host-session.vala
        sed -i 's/"frida_agent_main"/"main"/' src/qnx/qnx-host-session.vala
        sed -i 's/"frida_agent_main"/"main"/g' src/windows/windows-host-session.vala
        sed -i 's/"frida_agent_main"/"main"/' tests/test-agent.vala
        sed -i 's/"frida_agent_main"/"main"/' tests/test-injector.vala
        grep -rn '"main"' src/linux/linux-host-session.vala src/agent-container.vala
        cd ../..

        cd ..

        ARCHES="android-arm64"
        for ARCH in $ARCHES
        do
          mkdir build-$ARCH
          cd build-$ARCH
          ../frida/configure --host=$ARCH
          make
          cd ..
        done
    
    - name: Split Repository Name
      id: split_name
      run: |
        repo_name=${{ github.repository }}
        IFS='/' read -ra repo_parts <<< "$repo_name"
        echo "owner=${repo_parts[0]}" >> $GITHUB_OUTPUT
        echo "repo=${repo_parts[1]}" >> $GITHUB_OUTPUT

    - name: Check release version
      id: checkReleaseVersion
      uses: actions/github-script@v3
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const releaseVersion = '${{ needs.check_version.outputs.FRIDA_VERSION }}'
            const releaseResponse = await github.repos.getReleaseByTag({
              owner: '${{ steps.split_name.outputs.owner }}',
              repo: '${{ steps.split_name.outputs.repo }}',
              tag: releaseVersion
            })
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = releaseResponse;
            core.setOutput('id', releaseId);
            core.setOutput('html_url', htmlUrl);
            core.setOutput('upload_url', uploadUrl);
            core.setOutput('version', releaseVersion);
          } catch (e) {
            core.setFailed(e.message);
          }

    - name: package build result for Android
      shell: bash
      run: |
        cp build-android-arm64/subprojects/frida-core/server/frida-server build-android-arm64/subprojects/frida-core/server/pengrida-server
        cp build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so build-android-arm64/subprojects/frida-core/lib/gadget/pengrida-gadget.so

        gzip build-android-arm64/subprojects/frida-core/server/pengrida-server
        gzip build-android-arm64/subprojects/frida-core/lib/gadget/pengrida-gadget.so

    - name: Upload android arm64 frida-server for Pengrida
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: '${{ steps.checkReleaseVersion.outputs.upload_url }}'
        asset_path: '${{ github.workspace }}/build-android-arm64/subprojects/frida-core/server/pengrida-server.gz'
        asset_name: 'pengrida-server-${{ needs.check_version.outputs.FRIDA_VERSION }}-android-arm64.gz'
        asset_content_type: application/octet-stream

    - name: Upload android arm64 frida-gadget for Pengrida
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: '${{ steps.checkReleaseVersion.outputs.upload_url }}'
        asset_path: '${{ github.workspace }}/build-android-arm64/subprojects/frida-core/lib/gadget/pengrida-gadget.so.gz'
        asset_name: 'pengrida-gadget-${{ needs.check_version.outputs.FRIDA_VERSION }}-android-arm64.so.gz'
        asset_content_type: application/octet-stream

  ios_build:
    runs-on: macos-14
    needs: [check_version, create_release]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: build frida for iOS
      shell: bash
      env:
        IOS_CERTID: "-"
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        for path in ../patches/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "Apply patches in $real to frida/subprojects/$name"
          cd subprojects/$name
          for patchfile in ../../../patches/$name/*.patch
          do
            echo "Applying $patchfile"
            if ! git am --3way "$patchfile"; then
              echo "Patch failed, aborting this patch and continuing"
              git am --abort
            fi
          done
          cd ../..
        done

        echo "Manually re-applying symbol_frida_agent_main (patch 0003 fails to apply upstream but its content still applies cleanly by hand)"
        cd subprojects/frida-core
        cat > src/anti-anti-frida.py << 'PYEOF'
        import lief
        import sys
        import random
        import os

        if __name__ == "__main__":
            input_file = sys.argv[1]
            print(f"[*] Patch frida-agent: {input_file}")
            random_name = "".join(random.sample("ABCDEFGHIJKLMNO", 5))
            print(f"[*] Patch `frida` to `{random_name}``")

            binary = lief.parse(input_file)

            if not binary:
                exit()

            for symbol in binary.symbols:
                if symbol.name == "frida_agent_main":
                    symbol.name = "main"

                if "frida" in symbol.name:
                    symbol.name = symbol.name.replace("frida", random_name)

                if "FRIDA" in symbol.name:
                    symbol.name = symbol.name.replace("FRIDA", random_name)

            binary.write(input_file)
        PYEOF
        sed -i '' 's/"frida_agent_main"/"main"/' src/agent-container.vala
        sed -i '' 's/"frida_agent_main"/"main"/' src/darwin/darwin-host-session.vala
        sed -i '' 's/"frida_agent_main"/"main"/' src/freebsd/freebsd-host-session.vala
        sed -i '' 's/"frida_agent_main"/"main"/' src/linux/linux-host-session.vala
        sed -i '' 's/"frida_agent_main"/"main"/' src/qnx/qnx-host-session.vala
        sed -i '' 's/"frida_agent_main"/"main"/g' src/windows/windows-host-session.vala
        sed -i '' 's/"frida_agent_main"/"main"/' tests/test-agent.vala
        sed -i '' 's/"frida_agent_main"/"main"/' tests/test-injector.vala
        cd ../..
        cd ..

        for ARCH in arm64
        do
          mkdir build-ios-$ARCH
          cd build-ios-$ARCH
          ../frida/configure --prefix=/usr --host=ios-$ARCH -- \
              -Dfrida-gum:devkits=gum,gumjs \
              -Dfrida-core:compiler_backend=enabled \
              -Dfrida-core:assets=installed \
              -Dfrida-core:devkits=core
          make
          DESTDIR="$(pwd)/install" make install
          cd ..
        done

    - name: package iOS .deb packages
      shell: bash
      env:
        FRIDA_VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
      run: |
        brew install dpkg
        mkdir -p release-assets
        for ARCH in arm64
        do
          bash tools/package-server-fruity-pengrida.sh \
              "iphoneos-$ARCH" \
              "build-ios-$ARCH/install" \
              "release-assets/pengrida_${FRIDA_VERSION}_iphoneos-$ARCH.deb"
        done
        ls -la release-assets/

    - name: Check release version
      id: checkReleaseVersion
      uses: actions/github-script@v3
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const releaseVersion = '${{ needs.check_version.outputs.FRIDA_VERSION }}'
            const releaseResponse = await github.repos.getReleaseByTag({
              owner: '${{ github.repository_owner }}',
              repo: '${{ github.event.repository.name }}',
              tag: releaseVersion
            })
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = releaseResponse;
            core.setOutput('id', releaseId);
            core.setOutput('html_url', htmlUrl);
            core.setOutput('upload_url', uploadUrl);
            core.setOutput('version', releaseVersion);
          } catch (e) {
            core.setFailed(e.message);
          }

    - name: Upload iphoneos-arm64 deb for Pengrida
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: '${{ steps.checkReleaseVersion.outputs.upload_url }}'
        asset_path: '${{ github.workspace }}/release-assets/pengrida_${{ needs.check_version.outputs.FRIDA_VERSION }}_iphoneos-arm64.deb'
        asset_name: 'pengrida_${{ needs.check_version.outputs.FRIDA_VERSION }}_iphoneos-arm64.deb'
        asset_content_type: application/octet-stream
